# HTTP server — ACME challenges + redirect everything to HTTPS.
# The TLS server lives in tls.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bible.baptistnn.ru 168.222.202.131 _;

    # Let's Encrypt HTTP-01 challenge (keep for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bible.baptistnn.ru$request_uri;
    }
}
