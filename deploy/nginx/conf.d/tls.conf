# Enable AFTER certbot has issued a certificate for bible.baptistnn.ru:
#   mv tls.conf.disabled tls.conf  &&  docker compose restart nginx
# (and switch the :80 server in default.conf to a redirect-only block)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bible.baptistnn.ru;

    ssl_certificate     /etc/letsencrypt/live/bible.baptistnn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bible.baptistnn.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /directus {
        return 302 /directus/;
    }
    location /directus/ {
        set $up_directus directus;
        rewrite ^/directus/(.*)$ /$1 break;
        proxy_pass http://$up_directus:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Легаси-редиректы (были в middleware.ts до T7 — теперь на nginx).
    location ~ ^/app/dashboard/read/([^/]+)/([^/]+)$ {
        return 301 /app/dashboard/read?book=$1&chapter=$2;
    }
    location ~ ^/app/dashboard/songs/(\d+)$ {
        return 301 /app/dashboard/song?id=$1;
    }

    location /app/api/ {
        set $up_bff bff;
        proxy_pass http://$up_bff:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SW must be re-checked on every load — stale sw.js means stale precache forever.
    location = /app/sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # content-hashed, safe to cache forever.
    location /app/_next/static/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /app/manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /app {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /app;
    }
}
