# Enable AFTER certbot has issued a certificate for bible.baptistnn.ru:
#   mv tls.conf.disabled tls.conf  &&  docker compose restart nginx
# (and switch the :80 server in default.conf to a redirect-only block)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bible.baptistnn.ru;

    ssl_certificate     /etc/letsencrypt/live/bible.baptistnn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bible.baptistnn.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /directus {
        return 302 /directus/;
    }
    location /directus/ {
        set $up_directus directus;
        rewrite ^/directus/(.*)$ /$1 break;
        proxy_pass http://$up_directus:8055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /app {
        set $up_app app;
        proxy_pass http://$up_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = / {
        return 302 /app;
    }
}
