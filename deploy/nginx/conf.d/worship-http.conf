# Витрина worship (song.apps7.ru) — HTTP: ACME-проверка и редирект на HTTPS.
# Сертификат этому блоку не нужен, поэтому его включают ПЕРВЫМ, до выпуска сертификата:
# точное server_name забирает хост у серверного блока по умолчанию, и HTTP-01 certbot'а
# отвечает из того же webroot, что у основного домена. TLS-блок — worship.conf.disabled.

server {
    listen 80;
    listen [::]:80;
    server_name song.apps7.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://song.apps7.ru$request_uri;
    }
}
