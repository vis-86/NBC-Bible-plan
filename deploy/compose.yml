name: nbc-bible

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${PG_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}
      WEBSOCKETS_ENABLED: "true"
      # CORS: allow the app origin
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [internal]

  bff:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: bff
      args:
        # out/ is built in the shared `build` stage regardless (static export needs it),
        # but the BFF runtime itself only needs the runtime env below.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL}
        NEXT_PUBLIC_AI_ENABLE: ${NEXT_PUBLIC_AI_ENABLE}
        NEXT_PUBLIC_REGISTER_ENABLED: ${NEXT_PUBLIC_REGISTER_ENABLED}
        NEXT_PUBLIC_REGISTER_REQUIRE_CODE: ${NEXT_PUBLIC_REGISTER_REQUIRE_CODE:-true}
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BFF_PORT: "3001"
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
      # All Directus access is server-side (no browser usage of this URL),
      # so route it over the internal Docker network — independent of DNS/TLS.
      DIRECTUS_URL: http://directus:8055
      NEXT_PUBLIC_DIRECTUS_URL: http://directus:8055
      DIRECTUS_ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      INVITE_ADMIN_SECRET: ${INVITE_ADMIN_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # runtime секрет регистрации (можно менять/снимать без пересборки).
      # Задан ⇒ код обязателен. Пусто + REGISTER_OPEN_NO_CODE=true ⇒ открыто без кода; иначе 503.
      REGISTER_CHURCH_CODE: ${REGISTER_CHURCH_CODE:-}
      REGISTER_OPEN_NO_CODE: ${REGISTER_OPEN_NO_CODE:-}
      NEXT_PUBLIC_DIRECTUS_AI_FLOW_ID: ${NEXT_PUBLIC_DIRECTUS_AI_FLOW_ID:-ai-service}
    networks: [internal]

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: static
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL}
        NEXT_PUBLIC_AI_ENABLE: ${NEXT_PUBLIC_AI_ENABLE}
        NEXT_PUBLIC_REGISTER_ENABLED: ${NEXT_PUBLIC_REGISTER_ENABLED}
        NEXT_PUBLIC_REGISTER_REQUIRE_CODE: ${NEXT_PUBLIC_REGISTER_REQUIRE_CODE:-true}
    restart: unless-stopped
    depends_on: [bff, directus]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    networks: [internal]

volumes:
  pgdata:
  directus_uploads:
  directus_extensions:

networks:
  internal:
