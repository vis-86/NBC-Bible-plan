<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background: works both as a plain and as a maskable icon. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(0 20)">
  <!-- Am chord chart; all content stays inside the maskable safe zone (r ≈ 205). -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <!-- nut -->
    <line x1="156" y1="150" x2="356" y2="150" stroke-width="16"/>
    <!-- strings -->
    <g stroke-width="7">
      <line x1="156" y1="150" x2="156" y2="370"/>
      <line x1="196" y1="150" x2="196" y2="370"/>
      <line x1="236" y1="150" x2="236" y2="370"/>
      <line x1="276" y1="150" x2="276" y2="370"/>
      <line x1="316" y1="150" x2="316" y2="370"/>
      <line x1="356" y1="150" x2="356" y2="370"/>
    </g>
    <!-- frets -->
    <g stroke-width="6" stroke-opacity="0.85">
      <line x1="156" y1="205" x2="356" y2="205"/>
      <line x1="156" y1="260" x2="356" y2="260"/>
      <line x1="156" y1="315" x2="356" y2="315"/>
      <line x1="156" y1="370" x2="356" y2="370"/>
    </g>
  </g>
  <!-- fingers: B string fret 1, D and G strings fret 2 -->
  <g fill="#ffffff">
    <circle cx="316" cy="177.5" r="19"/>
    <circle cx="236" cy="232.5" r="19"/>
    <circle cx="276" cy="232.5" r="19"/>
  </g>
  <!-- warm accent: the open A string marker above the nut -->
  <circle cx="196" cy="116" r="12" fill="none" stroke="#fca5a5" stroke-width="6"/>
  </g>
</svg>
